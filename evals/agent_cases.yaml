- id: multi_turn_retrieval_eval
  conversation:
    - role: user
      content: "这篇报告将 query 分成了哪三类？"
    - role: assistant
      content: "报告将 query 分为三类：near-exact query、paraphrase query 和 cross-document query。"
    - role: user
      content: "什么是 near-exact query 呢？"
  question: "什么是 near-exact query 呢？"
  should_answer: true
  expected_standalone_question_contains:
    - "near-exact"
  expected_answer_contains:
    - "验证链路"
    - "跑通"
  expected_evidence_pages:
    - 4
  citation_required: true
  tags:
    - memory
    - contextualization