- id: rag_strategy_comparison
  question: "实验比较了哪三种切分策略？"
  should_answer: true
  expected_answer_contains:
    - "固定字符切分"
    - "段落感知切分"
    - "句子感知切分"
  expected_standalone_question_contains:
    - "切分策略"
  expected_evidence_pages:
    - 3
  citation_required: true
  tags:
    - rag
    - chunking

- id: user_roles_boundary
